<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
<title>Sign In · Order Console</title>
<link rel="stylesheet" href="styles.css" />
<script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
</head>
<body class="auth-body">
  <main class="auth-card" role="main">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Order Console</span>
    </div>
    <h1>Sign In</h1>
    <p class="muted">Staff access only. All activity is logged.</p>

    <form id="login-form" novalidate autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" />

      <button type="submit" id="login-btn">Sign In</button>
      <p id="error-msg" class="error" role="alert" aria-live="polite"></p>
    </form>

    <button id="magic-link-btn" class="ghost-btn">Email Me A Sign-In Link Instead</button>
    <p class="fineprint">Sessions expire automatically. Never share your password or a sign-in link.</p>

    <div class="demo-accounts">
      <p class="demo-accounts-title">Demo Accounts</p>
      <p><strong>Admin:</strong> admin@example.com / admin1234</p>
      <p><strong>Staff:</strong> staff@example.com / staff1234</p>
    </div>
  </main>

  <script type="module" src="config.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
