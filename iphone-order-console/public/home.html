<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Order Console</title>
  <link rel="stylesheet" href="styles.css">
  <script src="apply-prefs.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-nav">
        <h2>Console</h2>
        <a href="home.html" class="active">Orders & Inventory</a>
        <a href="users.html">Users</a>
        <a href="suppliers.html">Suppliers</a>
        <a href="settings.html">Settings</a>
      </div>
      <div class="sidebar-footer">
        <button id="signOutBtn" class="btn-signout">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1>Orders & Inventory Management (100 Items)</h1>
        <button id="themeToggle" class="theme-toggle-btn">Toggle Dark Mode</button>
      </header>

      <!-- Cascading Filter Options -->
      <section class="filter-bar">
        <div class="form-group">
          <label for="seriesFilter">iPhone Model</label>
          <select id="seriesFilter"><option value="">All Models (11 - 17)</option></select>
        </div>
        <div class="form-group">
          <label for="variantFilter">Variant</label>
          <select id="variantFilter" disabled><option value="">All Variants</option></select>
        </div>
        <div class="form-group">
          <label for="storageFilter">Storage</label>
          <select id="storageFilter" disabled><option value="">All Storage</option></select>
        </div>
        <div class="form-group">
          <label for="colorFilter">Color</label>
          <select id="colorFilter" disabled><option value="">All Colors</option></select>
        </div>
      </section>

      <!-- Separated Action Buttons -->
      <section class="action-bar">
        <button id="exportCsvBtn" class="btn-secondary">Export Inventory CSV</button>
        <button id="toggleOrderFormBtn" class="btn-primary">+ Add New Order</button>
      </section>

      <!-- Add / Edit Form -->
      <section class="card-section" id="orderFormCard" style="display: none;">
        <h3 id="orderFormTitle">Create New Order</h3>
        <form id="orderForm">
          <input type="hidden" id="orderId">
          <div class="form-row">
            <div class="form-group">
              <label for="formSeries">Series</label>
              <select id="formSeries" required><option value="">Select Model</option></select>
            </div>
            <div class="form-group">
              <label for="formVariant">Variant / Specific Model</label>
              <select id="formVariant" required disabled><option value="">Select Variant</option></select>
            </div>
            <div class="form-group">
              <label for="formStorage">Storage</label>
              <select id="formStorage" required disabled><option value="">Select Storage</option></select>
            </div>
            <div class="form-group">
              <label for="formColor">Color</label>
              <select id="formColor" required disabled><option value="">Select Color</option></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="formCondition">Condition</label>
              <select id="formCondition" required>
                <option value="New">New</option>
                <option value="Like New">Like New</option>
                <option value="Used - Excellent">Used - Excellent</option>
                <option value="Used - Good">Used - Good</option>
              </select>
            </div>
            <div class="form-group">
              <label for="formBattery">Battery Health</label>
              <input type="text" id="formBattery" placeholder="e.g. 95%" required>
            </div>
            <div class="form-group">
              <label for="formPrice">Price (RM)</label>
              <input type="number" id="formPrice" required placeholder="3599">
            </div>
            <div class="form-group">
              <label for="formStatus">Status</label>
              <select id="formStatus" required>
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Shipped">Shipped</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="formAddress">Shipping Address</label>
              <input type="text" id="formAddress" required placeholder="Jalan Bukit Bintang, KL">
            </div>
          </div>
          <button type="submit" class="btn-primary">Save Order</button>
          <button type="button" id="cancelOrderFormBtn" class="btn-secondary">Cancel</button>
        </form>
      </section>

      <!-- Main Orders Table -->
      <section class="card-section">
        <div class="table-container">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Year</th>
                <th>Model / Specs</th>
                <th>Condition</th>
                <th>Battery</th>
                <th>Price</th>
                <th>Address</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script type="module" src="iphone-data.js"></script>
  <script type="module" src="home.js"></script>
</body>
</html>
