<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
<title>Order Console</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Order Console</span>
    </div>
    <div class="topbar-right">
      <span id="user-email" class="muted"></span>
      <button id="logout-btn" class="ghost-btn">Sign out</button>
    </div>
  </header>

  <main class="dashboard">
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><span class="stat-num" id="stat-total">—</span><span class="stat-label">Total orders</span></div>
      <div class="stat-card"><span class="stat-num" id="stat-revenue">—</span><span class="stat-label">Total value (RM)</span></div>
      <div class="stat-card stat-pending"><span class="stat-num" id="stat-pending">—</span><span class="stat-label">Pending</span></div>
      <div class="stat-card stat-transit"><span class="stat-num" id="stat-transit">—</span><span class="stat-label">Processing + shipped</span></div>
      <div class="stat-card stat-done"><span class="stat-num" id="stat-delivered">—</span><span class="stat-label">Delivered</span></div>
    </div>

    <div class="dashboard-head">
      <div>
        <h1>iPhone orders</h1>
        <p class="muted"><span id="order-count">—</span> orders</p>
      </div>
      <div class="dashboard-actions">
        <input id="search-input" type="search" placeholder="Search name, order #, model…" />
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button id="refresh-btn" class="ghost-btn">Refresh</button>
        <button id="add-order-btn" class="primary-btn">+ Add order</button>
      </div>
    </div>

    <p id="save-toast" class="toast" hidden></p>

    <div class="table-wrap">
      <table id="orders-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="order_number">Order # <span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="customer_name">Customer <span class="sort-arrow"></span></th>
            <th>Shipping address</th>
            <th class="sortable" data-sort="iphone_model">Model <span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="model_year">Year <span class="sort-arrow"></span></th>
            <th>Storage</th>
            <th>Color</th>
            <th>Condition</th>
            <th class="sortable" data-sort="battery_health">Battery % <span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="price">Price (RM) <span class="sort-arrow"></span></th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <tr><td colspan="12" class="muted center">Loading orders…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add/Edit order modal -->
  <dialog id="order-dialog">
    <form id="order-form" method="dialog">
      <h2 id="dialog-title">Add order</h2>
      <input type="hidden" id="f-id" />

      <div class="form-grid">
        <label>Order # <input id="f-order_number" required /></label>
        <label>Customer name <input id="f-customer_name" required /></label>
        <label>Customer email <input id="f-customer_email" type="email" required /></label>
        <label class="span-2">Shipping address <input id="f-shipping_address" required /></label>
        <label>Model
          <select id="f-iphone_model" required></select>
        </label>
        <label>Year <input id="f-model_year" type="number" readonly tabindex="-1" /></label>
        <label>Storage
          <select id="f-storage_gb" required></select>
        </label>
        <label>Color
          <select id="f-color" required></select>
        </label>
        <label>Condition
          <select id="f-condition" required>
            <option value="new">New</option>
            <option value="like_new">Like new</option>
            <option value="used">Used</option>
          </select>
        </label>
        <label>Battery health % <input id="f-battery_health" type="number" min="0" max="100" /></label>
        <label>Price (RM) <input id="f-price" type="number" min="0" step="0.01" required /></label>
        <label>Status
          <select id="f-status" required>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
      </div>

      <p id="form-error" class="error" role="alert"></p>

      <div class="dialog-actions">
        <button type="button" id="cancel-btn" class="ghost-btn">Cancel</button>
        <button type="submit" id="save-btn" class="primary-btn">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
