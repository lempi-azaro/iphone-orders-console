<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management</title>
  <link rel="stylesheet" href="styles.css">
  <script src="apply-prefs.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-nav">
        <h2>Console</h2>
        <a href="home.html">Orders & Inventory</a>
        <a href="users.html" class="active">Users</a>
        <a href="suppliers.html">Suppliers</a>
        <a href="settings.html">Settings</a>
      </div>
      <div class="sidebar-footer">
        <button id="signOutBtn" class="btn-signout">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1>Team & User Management</h1>
        <button id="themeToggle" class="theme-toggle-btn">Toggle Dark Mode</button>
      </header>

      <section class="card-section">
        <h3>Add New User</h3>
        <form id="addUserForm">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="userName" required placeholder="John Doe">
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="userEmail" required placeholder="john@example.com">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Role</label>
              <select id="userRole">
                <option value="Admin">Admin</option>
                <option value="Manager">Manager</option>
                <option value="Staff">Staff</option>
              </select>
            </div>
            <div class="form-group" style="align-self: flex-end;">
              <button type="submit" class="btn-primary">Add User</button>
            </div>
          </div>
        </form>
      </section>

      <section class="card-section">
        <h3>Team Members</h3>
        <div class="table-container">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Movements</th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="users.js"></script>
</body>
</html>
